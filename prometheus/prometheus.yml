global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: blog-cms
    environment: local-lab

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  # Container CPU, memory, network and lifecycle metrics from Docker Engine's stats API.
  - job_name: docker-exporter
    static_configs:
      - targets: ["docker-exporter:9713"]

  # Nginx connections and HTTP request counters via stub_status exporter.
  - job_name: nginx
    static_configs:
      - targets: ["nginx-exporter:9113"]

  # MySQL server metrics via a dedicated exporter DB account.
  - job_name: mysql
    static_configs:
      - targets: ["mysqld-exporter:9104"]

  # HTTP(S) probe of the WordPress login endpoint through Nginx.
  - job_name: wordpress
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://nginx:8443/wp-login.php
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: blackbox-exporter
    static_configs:
      - targets: ["blackbox-exporter:9115"]

  # Loki and Promtail expose their own health/performance metrics.
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: promtail
    static_configs:
      - targets: ["promtail:9080"]
