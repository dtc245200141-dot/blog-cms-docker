server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions/positions.yml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Nginx access logs. Parse method/status as low-cardinality labels; do not label full URL paths.
  - job_name: nginx-access
    static_configs:
      - targets: [localhost]
        labels:
          job: nginx
          service: nginx
          log_type: access
          __path__: /var/log/nginx/access.log
    pipeline_stages:
      - regex:
          expression: '^(?P<remote_addr>\S+) - (?P<remote_user>\S+) \[(?P<time_local>[^]]+)\] "(?P<method>\S+) (?P<path>[^ ]*) (?P<protocol>[^"]*)" (?P<status>\d{3}) (?P<body_bytes_sent>\d+)'
      - labels:
          method:
          status:

  - job_name: nginx-error
    static_configs:
      - targets: [localhost]
        labels:
          job: nginx
          service: nginx
          log_type: error
          __path__: /var/log/nginx/error.log

  # PHP/WordPress errors are written outside the public web root to an isolated log volume.
  - job_name: wordpress-php
    static_configs:
      - targets: [localhost]
        labels:
          job: wordpress
          service: wordpress
          log_type: php
          __path__: /var/log/wordpress/debug.log
    pipeline_stages:
      - multiline:
          firstline: '^\[[0-9]{2}-[A-Za-z]{3}-[0-9]{4} '

  - job_name: mysql-error
    static_configs:
      - targets: [localhost]
        labels:
          job: mysql
          service: mysql
          log_type: error
          __path__: /var/log/mysql/error.log
